name: CI
on:
  push: null
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  license:
    name: Check license header
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: apache/skywalking-eyes/header@501a28d2fb4a9b962661987e50cf0219631b32ff
      with:
        config: .github/licenserc.yaml
  security:
    name: Audit security
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-security
      run: echo stepify-probe-security
    - name: stepify-fault-security
      run: exit 1
    - uses: actions/checkout@v4
    - name: Install cargo-aduit
      run: cargo install cargo-audit
    - name: Audit dependencies
      run: cargo audit
    - name: stepify-tail-security
      run: echo stepify-tail-security
  style:
    name: Audit style
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-style
      run: echo stepify-probe-style
    - uses: actions/checkout@v4
    - name: Check clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Check format
      run: cargo fmt --all -- --check
    - name: stepify-tail-style
      run: echo stepify-tail-style
  test:
    name: Run tests
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install mysql-client
      if: ${{ contains(matrix.os, 'macos') }}
      run: brew install mysql@8.4
    - run: cargo build
    - run: 'export PATH="/opt/homebrew/opt/mysql@8.4/bin:$PATH"

        cargo test --lib --bins --tests -- --include-ignored

        '
  pass:
    name: All tests passed
    runs-on: ubuntu-latest
    needs:
    - security
    - style
    - test
    steps:
    - name: stepify-probe-pass
      run: echo stepify-probe-pass
    - run: exit 0
    - name: stepify-tail-pass
      run: echo stepify-tail-pass
